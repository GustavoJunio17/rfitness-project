name: rfitness

# Infra local opcional.
#
# Banco: o caminho recomendado é `supabase start` (Supabase CLI), que sobe
# Postgres + Auth + Storage + Realtime iguais à produção. Este compose serve
# para (a) rodar só um Postgres cru quando você não precisa de Auth/Storage e
# (b) subir a Evolution API para desenvolver o agente de WhatsApp.
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfitness
      POSTGRES_PASSWORD: rfitness
      POSTGRES_DB: rfitness
    ports:
      - "5432:5432"
    volumes:
      - rfitness_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfitness -d rfitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  # docker compose --profile whatsapp up -d
  evolution-api:
    image: atendai/evolution-api:latest
    profiles: ["whatsapp"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_ENABLED: "false"
      AUTHENTICATION_API_KEY: "change-me-evolution-key"
    volumes:
      - rfitness_evolution_data:/evolution/instances

volumes:
  rfitness_postgres_data:
  rfitness_evolution_data:
